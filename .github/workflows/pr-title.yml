# The pull request title becomes the squash-merge commit, which decides the
# release (see scripts/next-version.sh): it must be a Conventional Commit,
# and a releasing one carries its version (scripts/release-pr.sh).
#
#   feat: …   minor release      fix: … / perf: …   patch release
#   feat!: …  major release      docs: / chore: / ci: / refactor: / test: …  no release
#
# Only pull requests into main release. One into a development branch
# (a big feature built in steps) is tested by CI like any other, but its
# title decides nothing, so it is not checked here.
name: PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            ci
            build
            chore
            style
            revert

  # A release carries its version and changelog section; nothing else
  # changes the version.
  versioned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The version against the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: scripts/check-version.sh "$TITLE"
