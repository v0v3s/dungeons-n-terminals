# The pull request title becomes the squash-merge commit, which decides the
# release (see scripts/next-version.sh): it must be a Conventional Commit.
#
#   feat: …   minor release      fix: … / perf: …   patch release
#   feat!: …  major release      docs: / chore: / ci: / refactor: / test: …  no release
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            ci
            build
            chore
            style
            revert
