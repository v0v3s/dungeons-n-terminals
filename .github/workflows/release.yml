# Release on every merge to main whose (squash) commit is a releasing
# Conventional Commit: bump the workspace version, tag vX.Y.Z, build the
# binaries and publish a GitHub release with notes from the merged PRs.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    # The version bump this workflow pushes must not release again.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release)') }}
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: next
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          version=$(scripts/next-version.sh "$MESSAGE")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$version" ]; then echo "Releasing v$version"; else echo "No release for this commit"; fi

  tag:
    needs: version
    if: ${{ needs.version.outputs.version != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Bump the version, commit and tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed -i "/^\[workspace.package\]/,/^\[/s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          cargo update --workspace
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$VERSION"
          git tag "v$VERSION"
          git push origin main "v$VERSION"

  build:
    needs: [version, tag]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: dnt-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: dnt-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p dnt --target ${{ matrix.target }}
      # Plain binaries named by platform, the same in every release, so
      # releases/latest/download/<name> always gets the newest.
      - name: Name the binary
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/dnt
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          mkdir dist
          cp "$bin" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  # The app for Windows: an installer.
  app-windows:
    needs: [version, tag]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build
        working-directory: app
        run: |
          npm ci
          npx tauri build --bundles nsis
      - name: Name the installer
        shell: bash
        run: |
          mkdir dist
          cp target/release/bundle/nsis/*-setup.exe dist/dnt-app-windows-x86_64-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: dnt-app-windows
          path: dist/*

  # The app for Android: an APK signed with the key in the secrets
  # ANDROID_KEYSTORE (base64 of the .jks), ANDROID_KEY_ALIAS and
  # ANDROID_KEY_PASSWORD (see app/README.md). Skipped without them.
  app-android:
    needs: [version, tag]
    runs-on: ubuntu-latest
    env:
      KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}
      - name: Signing key
        id: key
        env:
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::notice::No ANDROID_KEYSTORE secret: the Android app is not built"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/dnt.jks"
          printf 'storeFile=%s\nkeyAlias=%s\npassword=%s\n' "$RUNNER_TEMP/dnt.jks" "$ALIAS" "$PASSWORD" > app/src-tauri/gen/android/keystore.properties
      - uses: dtolnay/rust-toolchain@stable
        if: steps.key.outputs.skip != 'true'
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        if: steps.key.outputs.skip != 'true'
      - uses: actions/setup-java@v4
        if: steps.key.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        if: steps.key.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build
        if: steps.key.outputs.skip != 'true'
        working-directory: app
        run: |
          # The runner comes with the Android SDK and NDKs.
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npm ci
          npx tauri android build --apk --target aarch64 --target armv7 --target x86_64
          mkdir ../dist
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk ../dist/dnt-app-android.apk
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.skip != 'true'
        with:
          name: dnt-app-android
          path: dist/*

  publish:
    # The terminal app releases even if an app build fails.
    needs: [version, build, app-windows, app-android]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum dnt-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
