# Release on every merge to main whose (squash) commit is a releasing
# Conventional Commit: bump the workspace version, name the changelog's
# Unreleased section after it, tag vX.Y.Z, build the binaries and apps, and
# publish a GitHub release with that section as its notes.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    # The version bump this workflow pushes must not release again.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release)') }}
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: next
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          version=$(scripts/next-version.sh "$MESSAGE")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$version" ]; then echo "Releasing v$version"; else echo "No release for this commit"; fi

  tag:
    needs: version
    if: ${{ needs.version.outputs.version != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Bump the version, commit and tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed -i "/^\[workspace.package\]/,/^\[/s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          cargo update --workspace
          scripts/release-notes.sh cut "$VERSION" "$(date -u +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$VERSION"
          git tag "v$VERSION"
          git push origin main "v$VERSION"

  build:
    needs: [version, tag]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: dnt-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: dnt-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.version.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p dnt --target ${{ matrix.target }}
      # Plain binaries named by platform, the same in every release, so
      # releases/latest/download/<name> always gets the newest.
      - name: Name the binary
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/dnt
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          mkdir dist
          cp "$bin" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  # The apps (Windows, Android), from the tagged commit.
  app:
    needs: [version, tag]
    uses: ./.github/workflows/app.yml
    with:
      ref: v${{ needs.version.outputs.version }}
    secrets: inherit

  publish:
    # The terminal app releases even if an app build fails.
    needs: [version, build, app]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.version.outputs.version }}
      - name: Notes from the changelog
        run: scripts/release-notes.sh notes "${{ needs.version.outputs.version }}" > "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum dnt-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
          files: dist/*
