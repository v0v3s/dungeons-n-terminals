# Release what a merged pull request versioned (scripts/release-pr.sh):
# when main's workspace version has no tag yet, run CI on it, tag it vX.Y.Z,
# build the binaries and apps, and publish a GitHub release with the
# changelog's section as its notes. Nothing is pushed to main.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything is tested first: nothing is tagged or released otherwise.
  ci:
    uses: ./.github/workflows/ci.yml

  # The version to release: main's, unless it already has its tag.
  version:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is released: nothing to do"
          else
            echo "Releasing v$version"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

  tag:
    needs: version
    if: ${{ needs.version.outputs.version != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag the merge
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"

  build:
    needs: [version, tag]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: dnt-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: dnt-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.version.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p dnt --target ${{ matrix.target }}
      # Plain binaries named by platform, the same in every release, so
      # releases/latest/download/<name> always gets the newest.
      - name: Name the binary
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/dnt
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          mkdir dist
          cp "$bin" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  # The apps (Windows, Android), from the tagged commit.
  app:
    needs: [version, tag]
    uses: ./.github/workflows/app.yml
    with:
      ref: v${{ needs.version.outputs.version }}
    secrets: inherit

  publish:
    # Only when every build passed: the terminal apps and the apps.
    needs: [version, build, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.version.outputs.version }}
      - name: Notes from the changelog
        run: scripts/release-notes.sh notes "${{ needs.version.outputs.version }}" > "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum dnt-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
          files: dist/*

  # The wiki follows the release: docs/wiki as it is in the tagged commit.
  # (GitHub creates the wiki's repository with its first page, made once on
  # the web.)
  wiki:
    needs: [version, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.version.outputs.version }}
      - name: Publish docs/wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git clone "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.wiki.git" "$RUNNER_TEMP/wiki"
          rsync -a --delete --exclude .git docs/wiki/ "$RUNNER_TEMP/wiki/"
          cd "$RUNNER_TEMP/wiki"
          git add -A
          if git diff --cached --quiet; then echo "The wiki is up to date"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "The wiki for v$VERSION"
          git push
