# Build the apps: the Windows installer and the Android APK (signed with
# the key in the repository secrets, see app/README.md). Run it by hand
# (Actions → App → Run workflow) for builds to try; releases call it too.
name: App

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        default: main
        required: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The app for Windows: an installer.
  app-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build
        working-directory: app
        run: |
          npm ci
          npx tauri build --bundles nsis
      - name: Name the installer
        shell: bash
        run: |
          mkdir dist
          cp target/release/bundle/nsis/*-setup.exe dist/dnt-app-windows-x86_64-setup.exe
      - uses: actions/upload-artifact@v7
        with:
          name: dnt-app-windows
          path: dist/*

  # The app for Android: an APK signed with the key in the secrets
  # ANDROID_KEYSTORE (base64 of the .jks), ANDROID_KEY_ALIAS and
  # ANDROID_KEY_PASSWORD (see app/README.md). Skipped without them.
  app-android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Signing key
        id: key
        env:
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::notice::No ANDROID_KEYSTORE secret: the Android app is not built"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/dnt.jks"
          printf 'storeFile=%s\nkeyAlias=%s\npassword=%s\n' "$RUNNER_TEMP/dnt.jks" "$ALIAS" "$PASSWORD" > app/src-tauri/gen/android/keystore.properties
      - uses: dtolnay/rust-toolchain@stable
        if: steps.key.outputs.skip != 'true'
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        if: steps.key.outputs.skip != 'true'
      - uses: actions/setup-java@v6
        if: steps.key.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v7
        if: steps.key.outputs.skip != 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build
        if: steps.key.outputs.skip != 'true'
        working-directory: app
        run: |
          # The runner comes with the Android SDK and NDKs.
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npm ci
          npx tauri android build --apk --target aarch64 --target armv7 --target x86_64
          mkdir ../dist
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk ../dist/dnt-app-android.apk
      - uses: actions/upload-artifact@v7
        if: steps.key.outputs.skip != 'true'
        with:
          name: dnt-app-android
          path: dist/*
