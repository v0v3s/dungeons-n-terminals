# Format, lint and test every pull request, and main before a release.
name: CI

# On main it runs as the release's first step (release.yml), which
# releases only when it passes.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --exclude dnt-app --all-targets --locked -- -D warnings
      # The rule (e2e/README.md): every scenario has a test on every target.
      - name: Scenarios
        run: cargo test -p dnt --test scenarios --locked
      # Everything else, the terminal app's end-to-end tests among them
      # (also when the rule is broken: both results count).
      - name: Test
        if: ${{ !cancelled() }}
        run: cargo test --workspace --exclude dnt-app --locked

  # The Tauri app (app/): its web UI and its Rust side.
  app:
    name: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Changelog
        run: scripts/release-notes.sh check
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - name: Web UI
        working-directory: app
        run: |
          npm ci
          npm run check
          npm run build
      - name: Clippy
        run: cargo clippy -p dnt-app --all-targets --locked -- -D warnings
      - name: Clippy (an app store's build)
        run: cargo clippy -p dnt-app --all-targets --locked -- -D warnings
        env:
          DNT_STORE: "1"

  # The app on Windows: its end-to-end tests (app/e2e), on the build with
  # the e2e feature. (Windows also resolves imports without regard to case,
  # which the build checks.)
  app-windows:
    name: app (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Web UI
        working-directory: app
        run: npm ci
      - name: End-to-end tests
        working-directory: app
        shell: bash
        run: sh scripts/e2e-app.sh --target windows
      - name: Report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-windows-e2e
          path: |
            app/e2e/report
            app/e2e/results

  # The app on Android: its end-to-end tests (app/e2e) on an emulator, a
  # phone in portrait. A recent system image: an older one's WebView (which
  # a phone would have updated) is too old for Playwright's DevTools calls. The APK is a debug build (signed with the debug key,
  # its WebView debuggable) with the e2e feature, for x86_64 only.
  app-android:
    name: app (android)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_LEVEL: 36
    steps:
      - uses: actions/checkout@v7
      # The emulator needs hardware acceleration.
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-e2e
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build
        working-directory: app
        run: |
          # The runner comes with the Android SDK and NDKs.
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          # Debug (signed with the debug key), its Rust optimized: the
          # unoptimized app starts too slowly on the emulator.
          export CARGO_PROFILE_DEV_OPT_LEVEL=2
          npm ci
          npx tauri android build --apk --debug --target x86_64 --features e2e
          ls src-tauri/gen/android/app/build/outputs/apk/*/*/
      # The emulator, booted once and kept as a snapshot. A newer emulator
      # cannot load an older one's snapshot: its version is in the key.
      - name: Emulator version
        id: emulator
        run: echo "version=$("$ANDROID_HOME/emulator/emulator" -version | grep -oE '[0-9]+(\.[0-9]+)+' | head -1)" >> "$GITHUB_OUTPUT"
      - name: Emulator cache
        uses: actions/cache@v6
        id: avd
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-google_apis-x86_64-pixel_6-${{ steps.emulator.outputs.version }}
      - name: Emulator snapshot
        if: steps.avd.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "The emulator's snapshot, for the cache."
      - name: End-to-end tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          DNT_DEVICE: emulator-5554
          DNT_E2E_APK: src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: app
          # Which WebView the image has (Playwright needs a recent one).
          script: |
            adb shell dumpsys webviewupdate | grep -i "current webview package" || true
            # The cached emulator may keep an install signed with another
            # run's debug key, which the new APK cannot update.
            adb uninstall cz.v0v3s.dnt || true
            sh scripts/e2e-app.sh --target android --no-build
      - name: Report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-android-e2e
          path: |
            app/e2e/report
            app/e2e/results
