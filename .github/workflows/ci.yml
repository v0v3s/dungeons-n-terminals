# Format, lint and test every pull request and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --exclude dnt-app --all-targets --locked -- -D warnings
      # The rule (e2e/README.md): every scenario has a test on every target.
      - name: Scenarios
        run: cargo test -p dnt --test scenarios --locked
      # Everything else, the terminal app's end-to-end tests among them.
      - name: Test
        run: cargo test --workspace --exclude dnt-app --locked

  # The Tauri app (app/): its web UI and its Rust side.
  app:
    name: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Changelog
        run: scripts/release-notes.sh check
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - name: Web UI
        working-directory: app
        run: |
          npm ci
          npm run check
          npm run build
      - name: Clippy
        run: cargo clippy -p dnt-app --all-targets --locked -- -D warnings

  # The app on Windows: its end-to-end tests (app/e2e), on the build with
  # the e2e feature. (Windows also resolves imports without regard to case,
  # which the build checks.)
  app-windows:
    name: app (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Web UI
        working-directory: app
        run: npm ci
      - name: End-to-end tests
        working-directory: app
        shell: bash
        run: sh scripts/e2e-app.sh --target windows
      - name: Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-windows-e2e
          path: |
            app/e2e/report
            app/e2e/results
