not = { tui = "the terminal's data screen is its own layout of panes" }

[[scenario]]
id = "notes.phone"
does = "On a phone the notes are a section: the search a prompt line with + note, quick note and ⋯ on it; the notes at the top level, then each folder as a section (its title its menu, its count and a + on its line, the first few notes and the rest a tap away, a note's status or type at its right), the empty folders on one line; an open note a section too (its name the title, read/edit and ⋯ on it, its path under it, an empty list just its title)."
targets = ["android"]
not = { tui = "the terminal's notes are its own layout of panes" }

[[scenario]]
id = "campaigns.cards"
does = "On a computer the campaigns are cards side by side, as many as fit, each with its actions in sight (books & homebrew, rename, export, delete, make active)."
targets = ["windows"]
not = { tui = "the terminal lists the campaigns, acting on the one under the cursor with keys" }

[[scenario]]
id = "characters.cards"
does = "On a computer the characters are cards side by side, as many as the window has room for."
targets = ["windows"]
not = { tui = "the terminal lists the characters one under another" }

[[scenario]]
id = "layout.dialogs"
does = "On a computer a dialog is a roomy card with its title across the top and a ✕ that closes it (Esc and a click outside too); it opens and closes with a short fade and scale (none with reduced motion), and an entry read from the sheet opens once it is read, inside the window at any size."
targets = ["windows"]
not = { tui = "the terminal's dialogs are boxes closed with Esc" }

[[scenario]]
id = "layout.wide"
does = "On a big screen (2560 and 3840 px wide) every section and the sheet span the window, the text and controls grow with it, more columns come in, and running text still wraps at a comfortable length."
targets = ["windows"]
not = { tui = "a terminal's text is the size its terminal sets; its panes span the window (layout.fits)" }

[[scenario]]
id = "layout.even-gutters"
does = "On a computer with the sidebar hidden, every section's content is as far from the window's left as from its right."
targets = ["windows"]
not = { tui = "the terminal's panes span its window" }

[[scenario]]
id = "layout.sidebar"
does = "On a computer, ☰ in the header hides and shows a section's sidebar (the notes' folders, the party beside a sheet), and in a window narrower than 1200 px it starts hidden."
targets = ["windows"]
not = { tui = "the terminal shows its panes as its window allows, with no sidebar to hide" }

[[scenario]]
id = "layout.focus"
does = "On a computer, Tab moves through the controls, and the one the keyboard is on is outlined."
targets = ["windows"]
not = { tui = "the terminal shows where the keys go by its highlighted row and cursor" }

# ---------------------------------------------------------------- companions
[[scenario]]
id = "companions.familiar"
does = "Casting a spell whose rules give a familiar (Find Familiar) asks for a creature it allows (the Owl, not a Wolf) and a type (Fey); the familiar has its own card on the Companions tab (HP, AC, speed, abilities, skills, passive Perception), and its Perception rolls in its name. The spell gives one at a time: casting it again with one there says so."
targets = ["tui", "app"]

[[scenario]]
id = "companions.feature-spell"
does = "A spell a feature gives to cast without a slot (Pact of the Chain's Find Familiar) is cast at once, spending no slot, and summons by the spell's own rules: it asks for the familiar."
targets = ["tui", "app"]

[[scenario]]
id = "companions.summon"
does = "A book's spell that is the SRD's Find Steed (the data says so: the test book's Call Steed) has the SRD's built-in rules: cast with a level 4 slot it summons the Otherworldly Steed: its numbers follow the level it was cast at and its owner (AC 14, 45 HP, a Fly speed, its slam at the owner's spell attack (+6) with 1d8 + 4 damage), and only its chosen type's slam is there."
targets = ["tui", "app"]

[[scenario]]
id = "companions.follower"
does = "Any creature joins as a follower from the Companions tab's add (in the app a line after the last companion; in the terminal a), which also lists the features that give companions: a Wolf, whose Bite rolls to hit with its damage; damage and healing keep its hit points; it can be renamed, have conditions, go away and come back, and leave. A creature of one's own, made from the Creature homebrew template (Hireling), joins the same way."
targets = ["tui", "app"]
