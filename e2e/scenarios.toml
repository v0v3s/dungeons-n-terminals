[[scenario]]
id = "nav.menu-inside"
does = "The menu's sections unfold (▸, folded at first) to what is inside them: the compendium's categories and the open character's tabs, so the menu goes from anywhere to, say, the character's spells."
targets = ["android"]
not = { tui = "no menu: the number keys change the section, Tab the category or the tab" }

[[scenario]]
id = "nav.help"
does = "See the keys of every screen."
targets = ["tui"]
not = { app = "the app has no keys to learn: buttons say what they do" }

[[scenario]]
id = "layout.fits"
does = "Every screen fits its window: nothing runs off the side or wraps a button's label."
targets = ["tui", "app"]
