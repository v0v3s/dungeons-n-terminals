# The scenario catalog: every user-visible feature of dnt, and the targets
# it is tested on end to end. THE RULE (see CLAUDE.md and e2e/README.md):
# a new or changed feature adds or updates its scenarios here, and a test
# for each target, in the same change. `cargo test -p dnt --test scenarios`
# fails when a scenario misses a test on a target, or a test names a
# scenario that is not here.
#
#   id       area.what, lowercase (the tests name it: Tui::scenario("id", …)
#            in crates/dnt/tests/e2e, tag "@id" in app/e2e)
#   does     what the user does and sees
#   targets  where it is tested: "tui" (the terminal app, Linux and
#            Windows), "app" (the Tauri app, Android and Windows),
#            "android" (the app on a phone only: touch)
#   not      why a frontend without it does not have it: { tui = "…" } or
#            { app = "…" }; every scenario says "tui" and "app" one way or
#            the other

# ---------------------------------------------------------------- setup
[[scenario]]
id = "setup.srd-built-in"
does = "On the first start the SRD 5.2.1 is there, nothing to import: it asks for a campaign, and the compendium has the SRD's entries."
targets = ["tui", "app"]

[[scenario]]
id = "setup.import-first-run"
does = "On the first start, a zip of more data can be imported from getting started (the app); it joins the SRD."
targets = ["app"]
not = { tui = "the terminal app imports with dnt import (data.import-later)" }

[[scenario]]
id = "setup.first-campaign"
does = "With the data in, create the first campaign; it becomes the active one."
targets = ["tui", "app"]

[[scenario]]
id = "setup.import-folder"
does = "Read a data folder in place with --data, over the built-in SRD, not imported."
targets = ["tui"]
not = { app = "the app imports zips only: it has no folder of its own to read" }

