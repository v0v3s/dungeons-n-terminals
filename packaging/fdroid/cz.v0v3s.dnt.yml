RepoType: git
Repo: https://github.com/v0v3s/dungeons-n-terminals.git

Builds:
  - versionName: 1.7.0
    versionCode: 10070001
    commit: v1.7.0
    subdir: app/src-tauri/gen/android
    sudo:
      - apt-get update
      - apt-get install -y build-essential nodejs npm rustup
    output: app/build/outputs/apk/arm/release/app-arm-release-unsigned.apk
    prebuild: sed -i -e 's/"versionCode":[[:space:]]*[0-9]*/"versionCode":$$VERCODE$$/'
      ../../tauri.conf.json
    build:
      - rustup set profile minimal
      - rustup default 1.99.1
      - rustup target add armv7-linux-androideabi
      - export NDK_HOME=$$NDK$$
      - export DNT_STORE=1
      - printf '#!/bin/sh\nexec gradlew-fdroid "$@"\n' > gradlew
      - chmod +x gradlew
      - cd ../../..
      - npm ci --no-audit --no-fund
      - npx tauri android build --apk --split-per-abi --ci --target armv7 -- --locked
    ndk: 28.2.13676358

