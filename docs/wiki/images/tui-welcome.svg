<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1176 810" width="1176" height="810" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="14"><rect width="100%" height="100%" fill="#1a1b26"/><rect x="260.4" y="486" width="58.799995" height="18" fill="#414868"/><rect x="394.8" y="486" width="42" height="18" fill="#414868"/><text x="235.19998" y="247.5" fill="#e0af68" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">╭</text><text x="243.59999" y="247.5" fill="#e0af68" font-weight="bold" textLength="142.79999" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Getting started </text><text x="386.4" y="247.5" fill="#e0af68" textLength="554.39996" lengthAdjust="spacingAndGlyphs" xml:space="preserve">─────────────────────────────────────────────────────────────────╮</text><text x="235.19998" y="265.5" fill="#e0af68" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="932.39996" y="265.5" fill="#e0af68" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="235.19998" y="283.5" fill="#e0af68" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="260.4" y="283.5" fill="#e0af68" font-weight="bold" textLength="327.59998" lengthAdjust="spacingAndGlyphs" xml:space="preserve">dnt: a D&amp;D 5e companion in the terminal</text><text x="932.39996" y="283.5" fill="#e0af68" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="235.19998" y="301.5" fill="#e0af68" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="932.39996" y="301.5" fill="#e0af68" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="235.19998" y="319.5" fill="#e0af68" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="260.4" y="319.5" fill="#414868" textLength="176.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">▸ 1 · Import the data</text><text x="932.39996" y="319.5" fill="#e0af68" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="235.19998" y="337.5" fill="#e0af68" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="243.59999" y="337.5" fill="#c0caf5" textLength="688.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  dnt ships no game content: it reads the rules, spells, classes and items from   </text><text x="932.39996" y="337.5" fill="#e0af68" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="235.19998" y="355.5" fill="#e0af68" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="243.59999" y="355.5" fill="#c0caf5" textLength="688.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">  data you import.                                                                </text><text x="932.39996" y="355.5" fill="#e0af68" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="235.19998" y="373.5" fill="#e0af68" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="260.4" y="373.5" fill="#414868" textLength="604.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">scripts/pack-data.sh (in the project) makes a small zip of just what dnt</text><text x="932.39996" y="373.5" fill="#e0af68" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="235.19998" y="391.5" fill="#e0af68" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="260.4" y="391.5" fill="#414868" textLength="562.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">reads. Give the zip's path, or a data folder's to read it in place:</text><text x="932.39996" y="391.5" fill="#e0af68" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="235.19998" y="409.5" fill="#e0af68" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="932.39996" y="409.5" fill="#e0af68" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="235.19998" y="427.5" fill="#e0af68" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="260.4" y="427.5" fill="#e0af68" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">❯ </text><text x="932.39996" y="427.5" fill="#e0af68" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="235.19998" y="445.5" fill="#e0af68" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="932.39996" y="445.5" fill="#e0af68" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="235.19998" y="463.5" fill="#e0af68" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="260.4" y="463.5" fill="#414868" textLength="310.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">· 2 · Create a campaign    · 3 · Play</text><text x="932.39996" y="463.5" fill="#e0af68" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="235.19998" y="481.5" fill="#e0af68" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="932.39996" y="481.5" fill="#e0af68" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="235.19998" y="499.5" fill="#e0af68" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="260.4" y="499.5" fill="#c0caf5" textLength="58.799995" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> enter </text><text x="319.19998" y="499.5" fill="#414868" textLength="75.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> import  </text><text x="394.8" y="499.5" fill="#c0caf5" textLength="42" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> esc </text><text x="436.8" y="499.5" fill="#414868" textLength="42" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> quit</text><text x="932.39996" y="499.5" fill="#e0af68" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="235.19998" y="517.5" fill="#e0af68" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="932.39996" y="517.5" fill="#e0af68" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="235.19998" y="535.5" fill="#e0af68" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="932.39996" y="535.5" fill="#e0af68" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="235.19998" y="553.5" fill="#e0af68" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="932.39996" y="553.5" fill="#e0af68" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="235.19998" y="571.5" fill="#e0af68" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="932.39996" y="571.5" fill="#e0af68" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="235.19998" y="589.5" fill="#e0af68" textLength="705.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">╰──────────────────────────────────────────────────────────────────────────────────╯</text></svg>