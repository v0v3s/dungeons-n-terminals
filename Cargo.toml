[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["vendor/edtui"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
dnt-core = { path = "crates/dnt-core" }
dnt-data = { path = "crates/dnt-data" }
dnt-rules = { path = "crates/dnt-rules" }
dnt-store = { path = "crates/dnt-store" }

# edtui with word-aware line wrapping (see vendor/edtui/PATCHES.md).
[patch.crates-io]
edtui = { path = "vendor/edtui" }
