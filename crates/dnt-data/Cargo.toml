[package]
name = "dnt-data"
description = "D&D 5e data model (see schemas/), import and search index"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nucleo-matcher = "0.3.1"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
jsonschema = { version = "=0.57.0", default-features = false }

