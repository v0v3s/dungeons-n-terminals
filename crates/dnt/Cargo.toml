[package]
name = "dnt"
description = "Dungeons & Terminals: a D&D 5e TUI for players"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dnt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
dnt-core.workspace = true
dnt-data.workspace = true
dnt-rules.workspace = true
dnt-store.workspace = true
edtui = { version = "0.11.7", default-features = false, features = ["mouse-support"] }
ratatui = "0.30.2"
serde_json = "1.0.154"
unicode-width = "0.2.2"
