# Built-in automation for the 2024 Player's Handbook (XPHB).
#
# Numbers come from class-table columns (`class.<class>.<column>`) wherever
# the book's table has them, so this file only says what each feature does.
# Format: see crates/dnt-rules/src/overlay.rs.


# ---- Barbarian ----

[[feature]]
id = "classFeature:Rage|Barbarian|XPHB|1"
[[feature.resource]]
key = "rage"
name = "Rage"
max = "class.barbarian.rages"
recharge = "long_rest"
short_rest_regain = "1"
[[feature.toggle]]
key = "raging"
name = "Raging"
[[feature.effect]]
target = "attack.strength.damage"
add = "class.barbarian.rage_damage"
when = "toggle('raging')"

[[feature]]
id = "classFeature:Unarmored Defense|Barbarian|XPHB|1"
name = "Unarmored Defense (Barbarian)"
[[feature.effect]]
target = "ac"
max = "10 + mod.dex + mod.con + armor.shield"
when = "armor.none"

[[feature]]
id = "classFeature:Fast Movement|Barbarian|XPHB|5"
[[feature.effect]]
target = "speed"
add = "10"
when = "not armor.heavy"

# ---- Bard ----

[[feature]]
id = "classFeature:Bardic Inspiration|Bard|XPHB|1"
[[feature.resource]]
key = "bardic_inspiration"
name = "Bardic Inspiration"
max = "max(1, mod.cha)"
recharge = "long_rest"
short_rest_regain = "if(level('Bard') >= 5, max(1, mod.cha), 0)"
[[feature.effect]]
target = "bardic.die"
set = "class.bard.bardic_die"

[[feature]]
