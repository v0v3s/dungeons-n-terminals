# ---- Monk ----

[[feature]]
id = "classFeature:Monk’s Focus|Monk|SRD52|2"
[[feature.resource]]
key = "focus"
name = "Focus Points"
max = "class.monk.focus_points"
recharge = "short_rest"

[[feature]]
id = "classFeature:Martial Arts|Monk|SRD52|1"
# Monk weapons: simple melee weapons and Light martial melee weapons.
[[feature.attack]]
kind = "monk weapon"
weapons = "weapon.melee and (weapon.simple or (weapon.martial and weapon.light))"
ability = "max(mod.str, mod.dex)"
die = "class.monk.martial_arts"
[[feature.effect]]
target = "attack.unarmed.mod"
set = "max(mod.str, mod.dex)"
[[feature.effect]]
target = "attack.unarmed.damage"
set = "class.monk.martial_arts + attack.unarmed.mod"

[[feature]]
id = "classFeature:Unarmored Defense|Monk|SRD52|1"
name = "Unarmored Defense (Monk)"
[[feature.effect]]
target = "ac"
max = "10 + mod.dex + mod.wis"
when = "armor.none and armor.shield == 0"

[[feature]]
id = "classFeature:Unarmored Movement|Monk|SRD52|2"
[[feature.effect]]
target = "speed"
add = "class.monk.unarmored_movement"
when = "armor.none and armor.shield == 0"


