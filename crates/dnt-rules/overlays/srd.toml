# dnt's built-in rules for the SRD 5.2.1: what its features do. Rules
# for other books are in the rules library (github.com/v0v3s/dnt-rules).
#
# Numbers come from class-table columns (`class.<class>.<column>`) wherever
# the table has them, so this file only says what each feature does.
# Format: see crates/dnt-rules/src/overlay.rs.


# ---- Choices features ask for ----

[[feature]]
id = "classFeature:Ability Score Improvement|*|*|*"
[[feature.choice]]
pick = "ability_increase"
feats = ["G"]

[[feature]]
id = "classFeature:Epic Boon|*|*|*"
[[feature.choice]]
pick = "feat"
feats = ["EB", "G"]

[[feature]]
id = "classFeature:Expertise|*|*|*"
[[feature.choice]]
pick = "expertise"
count = "2"

# The 2024 feat is that choice itself, not one more feat to take.
[[feature]]
id = "feat:Ability Score Improvement|SRD52"
[[feature.choice]]
pick = "ability_increase"

[[feature]]
id = "classFeature:Weapon Mastery|Barbarian|SRD52|1"
[[feature.choice]]
pick = "weapon_mastery"
count = "class.barbarian.weapon_mastery"

[[feature]]
id = "classFeature:Weapon Mastery|Fighter|SRD52|1"
[[feature.choice]]
pick = "weapon_mastery"
count = "class.fighter.weapon_mastery"

[[feature]]
id = "classFeature:Weapon Mastery|Paladin|SRD52|1"
[[feature.choice]]
pick = "weapon_mastery"
count = "2"

[[feature]]
id = "classFeature:Weapon Mastery|Ranger|SRD52|1"
[[feature.choice]]
pick = "weapon_mastery"
count = "2"

[[feature]]
id = "classFeature:Weapon Mastery|Rogue|SRD52|1"
[[feature.choice]]
pick = "weapon_mastery"
count = "2"


# ---- Barbarian ----

[[feature]]
id = "classFeature:Rage|Barbarian|SRD52|1"
[[feature.resource]]
key = "rage"
name = "Rage"
max = "class.barbarian.rages"
recharge = "long_rest"
short_rest_regain = "1"
[[feature.toggle]]
key = "raging"
name = "Raging"
[[feature.effect]]
target = "attack.strength.damage"
add = "class.barbarian.rage_damage"
when = "toggle('raging')"

[[feature]]
id = "classFeature:Unarmored Defense|Barbarian|SRD52|1"
name = "Unarmored Defense (Barbarian)"
[[feature.effect]]
target = "ac"
max = "10 + mod.dex + mod.con + armor.shield"
when = "armor.none"

[[feature]]
id = "classFeature:Fast Movement|Barbarian|SRD52|5"
[[feature.effect]]
target = "speed"
add = "10"
when = "not armor.heavy"


